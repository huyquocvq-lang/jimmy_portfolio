<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!--
      Production URL is hard-coded into og:url / og:image / canonical because
      social crawlers (LinkedIn, Facebook, Slack, iMessage, WhatsApp) DO NOT run
      JavaScript and DO NOT respect relative paths.

      The canonical production origin is `https://www.jimmyvu.info`.
      The apex domain `https://jimmyvu.info` redirects to the www host in
      vercel.json so either shared URL exposes the same preview metadata.

      Then re-build and re-scrape via:
        - LinkedIn Post Inspector: https://www.linkedin.com/post-inspector/
        - Facebook Sharing Debugger: https://developers.facebook.com/tools/debug/
        - Twitter/X Card Validator: https://cards-dev.twitter.com/validator
        - Slack: post in any channel → use the "..." menu → "Remove link preview" → repost
    -->

    <title>Quoc Huy (Jimmy) - Portfolio</title>
    <meta
      name="description"
      content="Quoc Huy (Jimmy) - Senior Fullstack Software Engineer specializing in CMS platforms, microservices backends, mobile apps, and IoT systems."
    />
    <meta name="author" content="Quoc Huy (Jimmy)" />
    <meta name="theme-color" content="#1a1a1a" />

    <link rel="canonical" href="https://www.jimmyvu.info/" />

    <!-- Open Graph (LinkedIn, Facebook, iMessage, Slack, WhatsApp) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Quoc Huy (Jimmy) Portfolio" />
    <meta property="og:url" content="https://www.jimmyvu.info/" />
    <meta property="og:title" content="Quoc Huy (Jimmy) - Portfolio" />
    <meta
      property="og:description"
      content="Senior Fullstack Software Engineer specializing in CMS platforms, microservices backends, mobile apps, and IoT systems."
    />
    <meta property="og:image" content="https://www.jimmyvu.info/og-image.png" />
    <meta property="og:image:secure_url" content="https://www.jimmyvu.info/og-image.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="Quoc Huy (Jimmy) - Senior Fullstack Software Engineer portfolio cover"
    />
    <meta property="og:locale" content="en_US" />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Quoc Huy (Jimmy) - Portfolio" />
    <meta
      name="twitter:description"
      content="Senior Fullstack Software Engineer specializing in CMS platforms, microservices backends, mobile apps, and IoT systems."
    />
    <meta name="twitter:image" content="https://www.jimmyvu.info/og-image.png" />
    <meta
      name="twitter:image:alt"
      content="Quoc Huy (Jimmy) - Senior Fullstack Software Engineer portfolio cover"
    />

    <link rel="icon" href="/favicon/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon/favicon-16x16.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="48x48" href="/favicon/favicon-48x48.png" />
    <link rel="icon" type="image/png" sizes="64x64" href="/favicon/favicon-64x64.png" />
    <link rel="icon" type="image/png" sizes="96x96" href="/favicon/favicon-96x96.png" />
    <link rel="icon" type="image/png" sizes="128x128" href="/favicon/favicon-128x128.png" />
    <link rel="icon" type="image/png" sizes="256x256" href="/favicon/favicon-256x256.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/favicon/apple-touch-icon.png" />
    <link rel="manifest" href="/favicon/site.webmanifest" />

    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500;1,600&family=Source+Sans+Pro:wght@300;400;600;700&display=swap"
      rel="stylesheet"
    />

    <!-- Anti-FOUC: resolve theme before React mounts. Mirrors ThemeContext defaults. -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('portfolio-theme');
          var theme =
            stored === 'dark' || stored === 'light'
              ? stored
              : window.matchMedia &&
                window.matchMedia('(prefers-color-scheme: light)').matches
              ? 'light'
              : 'dark';
          document.documentElement.setAttribute('data-theme', theme);
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute('content', theme === 'light' ? '#ffffff' : '#1a1a1a');
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'dark');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
